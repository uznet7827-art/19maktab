{% extends 'dashboard/base.html' %}

{% block title %}Yangi Yutuq Qo'shish{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h4 class="fw-bold mb-0 text-dark">Yangi O'quvchi Yutug'i</h4>
        <small class="text-muted">Maktab faxrlanadigan yutuqni saytga chiqarish</small>
    </div>
    <a href="{% url 'dashboard_achievements' %}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
        &larr; Orqaga
    </a>
</div>

<div class="dash-card">
    <form method="post" action="{% url 'dashboard_achievement_add' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label class="form-label small fw-bold text-dark">O'quvchi Ism-Familiyasi <span class="text-danger">*</span></label>
                <input type="text" name="student_name" class="form-control" placeholder="Masalan: Bekzod Rahimov" required>
            </div>

            <div class="col-12 col-md-3">
                <label class="form-label small fw-bold text-dark">Sinfi</label>
                <input type="text" name="grade" class="form-control" placeholder="Masalan: 11-A">
            </div>

            <div class="col-12 col-md-3">
                <label class="form-label small fw-bold text-dark">Egallangan o'rin</label>
                <input type="text" name="place" class="form-control" placeholder="Masalan: 1-o'rin (Oltin medal)">
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label small fw-bold text-dark">Yo'nalishi (Turi)</label>
                <select name="achievement_type" class="form-select">
                    {% for val, label in type_choices %}
                        <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label small fw-bold text-dark">Yutuq / Musobaqa Nomi <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" placeholder="Masalan: Matematika fanidan Respublika olimpiadasi" required>
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold text-dark">Batafsil ma'lumot</label>
                <textarea name="description" rows="3" class="form-control" placeholder="Qanday natija ko'rsatgani haqida qisqacha..."></textarea>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label small fw-bold text-dark">O'quvchi surati (ixtiyoriy)</label>
                <input type="file" name="photo" class="form-control" accept="image/*">
            </div>

            <div class="col-12 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-warning text-dark fw-bold rounded-pill px-4">
                    <i class="fas fa-trophy me-1"></i> Yutuqni Saqlash
                </button>
                <a href="{% url 'dashboard_achievements' %}" class="btn btn-light border rounded-pill px-3">
                    Bekor qilish
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
