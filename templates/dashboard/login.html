<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19-Maktab Boshqaruv Tizimiga Kirish</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.12);
            width: 100%;
            max-width: 400px;
            padding: 2rem 1.75rem;
            border: 1px solid rgba(79, 70, 229, 0.1);
        }
        .login-brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4F46E5, #06B6D4);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-brand-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">19-Maktab Boshqaruvi</h4>
            <p class="text-muted small mb-0">Maktab ma'muriyat paneli</p>
        </div>

        {% if error_message %}
            <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
                <i class="fas fa-exclamation-circle me-1"></i> {{ error_message }}
            </div>
        {% endif %}

        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-{{ m.tags|default:'info' }} py-2 px-3 small rounded-3 mb-3">
                    {{ m }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'dashboard_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Admin Logini</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">Parol</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold" style="background: linear-gradient(135deg, #4F46E5, #3730A3); border: none;">
                <i class="fas fa-sign-in-alt me-1"></i> Tizimga kirish
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <a href="/" class="text-decoration-none small text-secondary">
                &larr; Asosiy maktab saytiga qaytish
            </a>
        </div>
    </div>
</body>
</html>
