{% extends 'dashboard/base.html' %}

{% block title %}Yangi Rasm Yuklash{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h4 class="fw-bold mb-0 text-dark">Galereyaga Rasm Yuklash</h4>
        <small class="text-muted">Maktab tadbirlari va hayotidan rasmlar qo'shish</small>
    </div>
    <a href="{% url 'dashboard_gallery' %}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
        &larr; Orqaga
    </a>
</div>

<div class="dash-card">
    <form method="post" action="{% url 'dashboard_gallery_add' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row g-3">
            <div class="col-12 col-md-8">
                <label class="form-label small fw-bold text-dark">Rasm Nomi / Ta'rifi <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" placeholder="Masalan: 1-sentabr 'Bilimlar kuni' tadbiri" required>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label small fw-bold text-dark">Kategoriya</label>
                <select name="category" class="form-select">
                    {% for val, label in category_choices %}
                        <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold text-dark">Rasm fayli (JPG / PNG) <span class="text-danger">*</span></label>
                <input type="file" name="image" class="form-control" accept="image/*" required>
            </div>

            <div class="col-12 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold">
                    <i class="fas fa-upload me-1"></i> Rasmni Yuklash
                </button>
                <a href="{% url 'dashboard_gallery' %}" class="btn btn-light border rounded-pill px-3">
                    Bekor qilish
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
