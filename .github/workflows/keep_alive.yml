name: 24/7 Keep-Alive Robot (Uyg'oq saqlovchi robot)

on:
  schedule:
    # Har 10 daqiqada avtomatik ishga tushadi (Render 15 daqiqada uxlaydi, 10 daqiqa uni doim uyg'oq tutadi)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Qo'lda ham ishga tushirish imkoniyati

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render and Custom Domain
        run: |
          echo "Ping yuborilmoqda..."
          curl -s -m 25 https://one9maktab-nmg.onrender.com/health/ || true
          curl -s -m 25 https://nmg-19maktab.uz/health/ || true
          echo "Server muvaffaqiyatli uyg'oq tutildi!"
